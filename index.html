<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">

<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2b2622;--mu:#8a7f74;--ac:#d9622b;--ac2:#fbe6da;--ok:#3f8f5a;--er:#c8372d;--bd:#eadfd2}
@media(prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#292420;--tx:#f3ece4;--mu:#a39686;--ac:#ef8a55;--ac2:#3a2a20;--bd:#3a332c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:720px;margin:0 auto;padding:16px 16px 80px}h1{font:700 24px Georgia,serif;margin:4px 0}h2{font-size:13px;color:var(--mu);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.sub{color:var(--mu);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}.btn.g{background:var(--ac2);color:var(--ac)}.btn.r{background:none;color:var(--er);padding:6px 10px}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;cursor:pointer}.tile span{font-size:26px}.tile b{display:block;font-size:15px}.tile small{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.card .m{flex:1;min-width:0}.t{font-weight:600;overflow-wrap:anywhere}.t.d{text-decoration:line-through;color:var(--mu)}
.chip{display:inline-block;font-size:12px;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 9px;margin:4px 4px 0 0;cursor:default}.chip.er{background:#f9dcd9;color:var(--er)}.chip.wa{background:#fbecc9;color:#996a00}.chip.ok{background:#d9eddf;color:var(--ok)}button.chip{border:0;cursor:pointer}
form.f{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:grid;gap:8px;margin:10px 0}form.f label{font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
.center{max-width:400px;margin:8vh auto 0;text-align:center}.center input{margin:4px 0}.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tabs .chip{padding:7px 14px;font-size:14px;white-space:nowrap}.tabs .on{background:var(--ac);color:#fff}
.logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.ov{position:fixed;inset:0;background:#fff;color:#111;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.ov svg{max-width:100%;height:auto}.ov .logo{width:84px;height:84px;font-size:30px;margin-bottom:10px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.code{font:700 26px ui-monospace,monospace;letter-spacing:.14em;background:var(--ac2);color:var(--ac);padding:10px;border-radius:12px;display:inline-block}.empty{text-align:center;color:var(--mu);padding:22px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}.err{color:var(--er);font-size:14px;min-height:20px}
</style></head><body><div id="app"><p class="empty">Caricamento…</p></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CONFIG={apiKey:"AIzaSyAq5mKZitfvQnLzAectINewg6FljGfXyqo",authDomain:"casanostra-db7c3.firebaseapp.com",projectId:"casanostra-db7c3",appId:"1:190944947892:web:cdc10f6b2abcafd7d931e1"}; // ← da Firebase (vedi LEGGIMI.md)
const app=initializeApp(CONFIG),auth=getAuth(app),db=getFirestore(app);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const CAT={"🥬 Frutta e verdura":"Mele,Banane,Arance,Limoni,Pomodori,Insalata,Zucchine,Carote,Patate,Cipolle,Aglio,Spinaci,Funghi,Basilico,Peperoni,Melanzane",
"🧀 Latticini e uova":"Latte,Yogurt,Mozzarella,Parmigiano,Burro,Uova,Ricotta,Mascarpone,Panna,Formaggio spalmabile",
"🥩 Carne e pesce":"Petto di pollo,Macinato,Prosciutto cotto,Prosciutto crudo,Salame,Salmone,Tonno in scatola,Merluzzo,Würstel",
"🍝 Dispensa":"Pasta,Riso,Farina,Zucchero,Sale,Olio extravergine,Aceto,Passata di pomodoro,Legumi,Biscotti,Cereali,Caffè,Tè,Pane,Fette biscottate,Marmellata,Nutella",
"🧊 Surgelati":"Piselli,Pizza surgelata,Gelato,Bastoncini di pesce,Spinaci surgelati",
"🥤 Bevande":"Acqua,Succo di frutta,Birra,Vino,Cola,Tonica",
"🧼 Casa":"Carta igienica,Carta da cucina,Detersivo piatti,Detersivo lavatrice,Ammorbidente,Sacchetti spazzatura,Spugne,Sgrassatore,Candeggina,Pastiglie lavastoviglie",
"🧴 Igiene":"Shampoo,Bagnoschiuma,Dentifricio,Spazzolino,Assorbenti,Pannolini,Salviette,Deodorante",
"🪑 Ikea":"Candele,Cornici,Scatole contenitore,Lampadine,Appendiabiti,Tende,Teglie",
"🔧 Ferramenta":"Viti,Chiodi,Nastro adesivo,Lampadina LED,Colla,Punte trapano,Guanti da lavoro,Silicone,Tasselli"};
const STORES={esselunga:["#e30613","E"],coop:["#e2001a","coop"],conad:["#e4032e","C"],carrefour:["#004e9f","C"],lidl:["#0050aa","L"],eurospin:["#0a3d91","E"],md:["#e30613","MD"],pam:["#d71920","P"],penny:["#cd1719","PN"],aldi:["#00005f","A"],ikea:["#0058a3","IK"],decathlon:["#0082c3","D"],"leroy merlin":["#78be20","LM"],bricoman:["#f58220","B"],obi:["#f26722","OBI"],douglas:["#111","D"],sephora:["#111","S"],mediaworld:["#d70000","MW"],unieuro:["#f26522","U"],feltrinelli:["#d71920","LF"],tigotà:["#e2007a","T"],tigota:["#e2007a","T"],acqua:["#00a0e3","A&S"],"q8":["#0a4ea2","Q8"],eni:["#ffd400","eni"],ip:["#d71920","IP"]};
const SEL=s=>s.split(',');
const MODS=[
{id:'card',n:'Carte Fedeltà',i:'💳',f:[['t','Negozio'],['code','Numero tessera / codice'],['bt','Tipo codice','sel','CODE128,EAN13,CODE39'],['who','Titolare']]},
{id:'list',n:'Liste Condivise',i:'🛒',f:[],chk:1},
{id:'agenda',n:'Agenda & Calendario',i:'📅',f:[['t','Impegno'],['d','Quando','datetime-local'],['who','Per chi']],date:1},
{id:'turni',n:'Turni di Lavoro',i:'🕒',f:[['who','Membro'],['d','Giorno','date'],['t','Turno (es. 14:00–22:00)']],date:1,nodue:1},
{id:'veic',n:'Veicoli & Scadenze',i:'🚗',f:[['t','Veicolo (es. Fiat Panda)'],['plate','Targa'],['yr','Anno','number']]},
{id:'doc',n:'Documenti Personali',i:'🪪',f:[['who','Persona'],['k','Documento','sel',"Carta d'identità,Passaporto,Patente,Tessera sanitaria"],['d','Scadenza','date']],date:1},
{id:'salute',n:'Salute & Benessere',i:'🩺',f:[['t','Voce (es. Tachipirina)'],['k','Tipo','sel','Medicinale,Visita medica,Libretto sanitario'],['d','Scadenza / data','date'],['who','Per chi']],date:1},
{id:'ric',n:'Ricettario',i:'🍝',f:[['t','Titolo'],['k','Metodo','sel','Tradizionale,Bimby'],['cat','Categoria','sel','Idea veloce,Per bambini,Speciale,Dolce'],['ing','Ingredienti (uno per riga)','area'],['st','Procedimento','area'],['bm','Impostazioni Bimby (es. 10 min · 100° · vel 2)']]},
{id:'spese',n:'Spese & Budget',i:'💶',f:[['t','Descrizione'],['amt','Importo €','number'],['k','Tipo','sel','Spesa,Bolletta,Altro'],['d','Data','date']],date:1,nodue:1,sum:1,budget:1},
{id:'manut',n:'Manutenzione & Domotica',i:'🛠️',f:[['t','Attività (es. Filtri clima)'],['k','Ogni','sel','Mese,3 mesi,6 mesi,Anno'],['d','Prossima','date']],date:1,chk:1},
{id:'disp',n:'Dispensa & Scorte',i:'🥫',f:[['t','Prodotto'],['q','Quantità rimasta']],chk:1},
{id:'det',n:'Spese Mediche / Detrazioni',i:'🧾',f:[['t','Spesa'],['amt','Importo €','number'],['d','Data','date'],['who','Per chi']],date:1,nodue:1,sum:1},
{id:'giar',n:'Giardino & Esterni',i:'🌿',f:[['t','Attività (es. Potare rose)'],['d','Quando','date']],date:1,chk:1}];
const VSC=['Bollo','Assicurazione','Revisione','Tagliando','Inversione gomme'];
const S={view:'home',items:[],cfg:{hidden:[],budget:0},code:null,u:null,form:false,veh:null,tab:'Tradizionale',lst:'Spesa',logo:null,cat:null};
const $=document.getElementById('app'),mod=id=>MODS.find(m=>m.id===id),en=()=>MODS.filter(m=>!S.cfg.hidden.includes(m.id));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fam=()=>'families/'+S.code,col=()=>collection(db,fam()+'/items'),nid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const days=d=>d?Math.ceil((new Date(d.length>10?d:d+'T00:00')-Date.now())/864e5):null;
const chipDue=d=>{const n=days(d);if(n===null)return'';return`<span class="chip ${n<0?'er':n<=30?'wa':'ok'}">${n<0?'Scaduto':n===0?'Oggi':n===1?'Domani':'tra '+n+' gg'}</span>`};
const fmt=d=>{if(!d)return'';const x=new Date(d.length>10?d:d+'T12:00');return x.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})+(d.length>10?' '+x.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'')};
const logo=i=>{if(i.logo)return`<div class="logo"><img alt="" src="${esc(i.logo)}"></div>`;const k=Object.keys(STORES).find(k=>(i.t||'').toLowerCase().includes(k)),s=STORES[k]||['#6b5f55',(i.t||'?').slice(0,2).toUpperCase()];return`<div class="logo" style="background:${s[0]};${k==='eni'?'color:#111':''}">${esc(s[1])}</div>`};
let unsubs=[];
const authUI=(msg='')=>$.innerHTML=`<div class="center"><h1>🏠 Casa Nostra</h1><p class="sub">Accedi per entrare nella tua famiglia</p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (min. 8 caratteri)" autocomplete="current-password"><p class="err" id="er">${msg}</p><button class="btn" style="width:100%" data-a="login">Accedi</button><button class="btn g" style="width:100%;margin-top:8px" data-a="reg">Crea account</button><button class="btn g" style="width:100%;margin-top:8px" data-a="goog">Continua con Google</button><p><a href="#" data-a="reset" class="sub">Password dimenticata?</a></p></div>`;
onAuthStateChanged(auth,async u=>{unsubs.forEach(f=>f());unsubs=[];S.u=u;S.code=null;if(!u)return authUI();
  const m=await getDoc(doc(db,'users/'+u.uid));if(m.exists()&&m.data().code){S.code=m.data().code;start()}else render()});
function start(){unsubs.push(onSnapshot(col(),s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));render();checkNotifs()}),onSnapshot(doc(db,fam()+'/cfg/main'),s=>{if(s.exists())S.cfg={hidden:[],budget:0,...s.data()};render()}));render()}
const gen=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>A[x%32]).join('')};
async function join(c,create){S.code=c;if(create){await setDoc(doc(db,'families/'+c),{owner:S.u.uid,created:Date.now()})}else if(!(await getDoc(doc(db,'families/'+c))).exists()){S.code=null;throw Error('Codice non trovato')}
  await setDoc(doc(db,fam()+'/members/'+S.u.uid),{at:Date.now()});await setDoc(doc(db,fam()+'/cfg/main'),{hidden:[],budget:0},{merge:true}).catch(()=>{});await setDoc(doc(db,'users/'+S.u.uid),{code:c});start()}
function render(){if(!S.u)return;
  if(!S.code)return $.innerHTML=`<div class="center"><h1>👋 Benvenuto</h1><p class="sub">${esc(S.u.email||'')}</p><button class="btn" style="width:100%" data-a="new">✨ Crea una nuova famiglia</button><div class="card" style="display:block;text-align:left;margin-top:12px"><label class="sub">Hai un codice invito?</label><input id="jc" maxlength="8" placeholder="CODICE A 8 CARATTERI" style="text-transform:uppercase"><button class="btn g" style="width:100%;margin-top:6px" data-a="join">Unisciti</button><p class="err" id="er"></p></div><button class="ic" data-a="out">Esci</button></div>`;
  const v=S.view;if(v==='home')return home();if(v==='set')return settings();if(v==='veh')return vehDetail();modView(mod(v))}
const vname=i=>{const v=S.items.find(x=>x.id===i.veh);return(v?v.t+' · ':'')+i.k};
function home(){const up=[];en().forEach(m=>{if(!m.date||m.nodue)return;S.items.filter(i=>i.m===m.id&&!i.done&&i.d).forEach(i=>up.push({m,i,n:days(i.d)}))});
  if(!S.cfg.hidden.includes('veic'))S.items.filter(i=>i.m==='vsc'&&i.d).forEach(i=>up.push({m:mod('veic'),i,n:days(i.d),t:vname(i)}));
  const u=up.filter(x=>x.n<=30).sort((a,b)=>a.n-b.n).slice(0,8);
  $.innerHTML=`<div class="top"><div><h1>🏠 Casa Nostra</h1><div class="sub">Il vostro hub di famiglia</div></div><button class="ic" data-a="go" data-v="set">⚙️</button></div>${u.length?'<h2>In arrivo</h2>'+u.map(({m,i,n,t})=>`<div class="card"><span style="font-size:22px">${m.i}</span><div class="m"><div class="t">${esc(t||i.t||i.k||i.who)}</div>${chipDue(i.d)}<span class="chip">${esc(fmt(i.d))}</span></div></div>`).join(''):''}${'Notification'in window&&Notification.permission==='default'?'<div class="card"><div class="m">🔔 Attiva i promemoria: 30, 15 e 5 giorni prima e il giorno della scadenza</div><button class="btn" data-a="notif">Attiva</button></div>':''}<h2>Le vostre schede</h2><div class="grid">${en().map(m=>{const c=S.items.filter(i=>i.m===m.id&&!(m.chk&&i.done)).length;return`<button class="tile" data-a="go" data-v="${m.id}"><span>${m.i}</span><b>${m.n}</b><small>${c} ${c===1?'voce':'voci'}</small></button>`}).join('')}</div>`}
const head=(m,btn=1)=>`<div class="top"><button class="ic" data-a="go" data-v="${S.view==='veh'?'veic':'home'}">← Indietro</button><h1 style="font-size:19px">${m.i} ${m.n}</h1>${btn?'<button class="btn" data-a="add">＋</button>':'<span></span>'}</div>`;
const field=([k,l,t,o],first)=>`<div><label>${l}</label>${t==='sel'?`<select name="${k}"><option value="">—</option>${SEL(o).map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:t==='area'?`<textarea name="${k}" rows="4"></textarea>`:`<input name="${k}" type="${t||'text'}" ${t==='number'?'step="0.01" inputmode="decimal"':''} ${k==='t'&&first?'list="stl"':''} ${first?'required':''} maxlength="400">`}</div>`;
const formH=(m,fs)=>S.form?`<form class="f" data-a="save">${fs.map((f,i)=>field(f,i===0)).join('')}${m.id==='card'?'<div><label>Logo personalizzato (facoltativo)</label><input type="file" accept="image/*" id="lg"></div><datalist id="stl">'+Object.keys(STORES).map(k=>`<option>${k[0].toUpperCase()+k.slice(1)}`).join('')+'</datalist>':''}<div style="display:flex;gap:8px"><button class="btn">Salva</button><button type="button" class="btn g" data-a="add">Annulla</button></div></form>`:'';
const del=id=>`<button class="btn r" data-a="del" data-id="${id}" aria-label="Elimina">✕</button>`;
function modView(m){const its=S.items.filter(i=>i.m===m.id);
  if(m.id==='card')return cards(m,its);if(m.id==='list')return lists(m,its);if(m.id==='veic')return vehs(m,its);if(m.id==='ric')return recipes(m,its);
  its.sort((a,b)=>m.date?String(a.d||'9').localeCompare(String(b.d||'9')):(a.at||0)-(b.at||0));if(m.chk)its.sort((a,b)=>!!a.done-!!b.done);
  let ex='';if(m.sum){const mk=new Date().toISOString().slice(0,7),tot=its.filter(i=>String(i.d||'').startsWith(mk)).reduce((s,i)=>s+(+i.amt||0),0);
    ex=m.budget?`<div class="card" style="display:block"><b>Questo mese: ${tot.toFixed(2)} €</b>${S.cfg.budget?` <span class="sub">su ${S.cfg.budget} €</span><div class="bar"><i style="width:${Math.min(100,tot/S.cfg.budget*100)}%;${tot>S.cfg.budget?'background:var(--er)':''}"></i></div>`:''}<div style="display:flex;gap:8px;margin-top:8px"><input id="bud" type="number" placeholder="Budget mensile €" value="${S.cfg.budget||''}"><button class="btn g" data-a="bud">Salva</button></div></div>`:`<div class="card"><b>Totale: ${its.reduce((s,i)=>s+(+i.amt||0),0).toFixed(2)} €</b></div>`}
  $.innerHTML=head(m)+ex+formH(m,m.f)+(its.map(i=>`<div class="card">${m.chk?`<input type="checkbox" ${i.done?'checked':''} data-a="tg" data-id="${i.id}">`:''}<div class="m"><div class="t ${i.done?'d':''}">${esc(i[m.f[0][0]])}</div>${m.f.slice(1).map(([k])=>i[k]?`<span class="chip">${k==='d'?esc(fmt(i[k])):k==='amt'?esc(i[k])+' €':esc(i[k])}</span>`:'').join('')}${m.date&&!m.nodue&&!i.done?chipDue(i.d):''}</div>${del(i.id)}</div>`).join('')||'<p class="empty">Ancora nulla. Tocca ＋</p>')}
function cards(m,its){its.sort((a,b)=>(a.t||'').localeCompare(b.t||''));
  $.innerHTML=head(m)+formH(m,m.f)+(its.map(i=>`<div class="card" data-a="bc" data-id="${i.id}" style="cursor:pointer">${logo(i)}<div class="m"><div class="t">${esc(i.t)}</div><span class="chip">${esc(i.who||'Famiglia')}</span><span class="chip">Mostra in cassa</span></div>${del(i.id)}</div>`).join('')||'<p class="empty">Aggiungi la prima tessera con ＋</p>')}
function lists(m,its){const names=[...new Set(['Spesa','Ikea','Ferramenta','Da fare',...its.map(i=>i.grp)])];
  const cur=its.filter(i=>(i.grp||'Spesa')===S.lst).sort((a,b)=>!!a.done-!!b.done||(a.at||0)-(b.at||0));
  $.innerHTML=head(m,0)+`<div class="tabs">${names.map(n=>`<button class="chip ${n===S.lst?'on':''}" data-a="lst" data-v="${esc(n)}">${esc(n)}</button>`).join('')}<button class="chip" data-a="nl">＋ Lista</button></div>
  <form class="f" data-a="qa"><input name="q" list="cat" placeholder="Aggiungi prodotto (cerca nel catalogo)…" maxlength="80" autocomplete="off"><datalist id="cat">${Object.values(CAT).join(',').split(',').map(x=>`<option>${esc(x)}`).join('')}</datalist></form>
  <div class="tabs">${Object.keys(CAT).map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-v="${esc(c)}">${c}</button>`).join('')}</div>
  ${S.cat?`<div>${CAT[S.cat].split(',').map(p=>`<button class="chip" data-a="qp" data-v="${esc(p)}">＋ ${esc(p)}</button>`).join('')}</div>`:''}
  <h2>${esc(S.lst)} · ${cur.filter(i=>!i.done).length} da prendere</h2>${cur.map(i=>`<div class="card"><input type="checkbox" ${i.done?'checked':''} data-a="tg" data-id="${i.id}"><div class="m"><div class="t ${i.done?'d':''}">${esc(i.t)}</div></div>${del(i.id)}</div>`).join('')||'<p class="empty">Lista vuota</p>'}${cur.some(i=>i.done)?'<button class="btn g" data-a="clr">Rimuovi i completati</button>':''}`}
function vehs(m,its){$.innerHTML=head(m)+formH(m,m.f)+(its.map(v=>{const sc=S.items.filter(i=>i.m==='vsc'&&i.veh===v.id).sort((a,b)=>(a.d||'').localeCompare(b.d||''))[0];return`<div class="card" data-a="vd" data-id="${v.id}" style="cursor:pointer"><span style="font-size:28px">🚗</span><div class="m"><div class="t">${esc(v.t)}</div>${v.plate?`<span class="chip">${esc(v.plate.toUpperCase())}</span>`:''}${v.yr?`<span class="chip">${esc(v.yr)}</span>`:''}${sc?`<span class="chip sub">Prossima: ${esc(sc.k)}</span>${chipDue(sc.d)}`:''}</div>${del(v.id)}</div>`}).join('')||'<p class="empty">Aggiungi il tuo primo veicolo con ＋</p>')}
function vehDetail(){const v=S.items.find(i=>i.id===S.veh);if(!v){S.view='veic';return render()}const sc=S.items.filter(i=>i.m==='vsc'&&i.veh===v.id).sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  $.innerHTML=head({i:'🚗',n:esc(v.t)})+`<p class="sub">${esc((v.plate||'').toUpperCase())} ${v.yr?'· '+esc(v.yr):''}</p>${S.form?`<form class="f" data-a="savesc"><div><label>Scadenza</label><select name="k">${VSC.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Data</label><input name="d" type="date" required></div><button class="btn">Salva</button></form>`:''}<h2>Scadenze</h2>${sc.map(i=>`<div class="card"><div class="m"><div class="t">${esc(i.k)}</div><span class="chip">${esc(fmt(i.d))}</span>${chipDue(i.d)}</div>${del(i.id)}</div>`).join('')||'<p class="empty">Nessuna scadenza. Tocca ＋</p>'}<div>${VSC.filter(x=>!sc.some(i=>i.k===x)).map(x=>`<span class="chip">manca: ${x}</span>`).join('')}</div>`}
function recipes(m,its){const cur=its.filter(i=>(i.k||'Tradizionale')===S.tab);
  $.innerHTML=head(m)+`<div class="tabs">${['Tradizionale','Bimby'].map(t=>`<button class="chip ${S.tab===t?'on':''}" data-a="tab" data-v="${t}">${t==='Bimby'?'🌀 Bimby':'🍳 Tradizionali'}</button>`).join('')}</div>`+formH(m,m.f)+(cur.map(i=>`<div class="card" style="align-items:flex-start"><div class="m"><div class="t">${esc(i.t)}</div>${i.cat?`<span class="chip">${esc(i.cat)}</span>`:''}${i.bm?`<span class="chip">🌀 ${esc(i.bm)}</span>`:''}<details><summary class="sub">Apri ricetta</summary><p><b>Ingredienti</b><br>${esc(i.ing).replace(/\n/g,'<br>')}</p><p><b>Procedimento</b><br>${esc(i.st).replace(/\n/g,'<br>')}</p></details></div>${del(i.id)}</div>`).join('')||'<p class="empty">Nessuna ricetta in questa sezione</p>')}
function settings(){$.innerHTML=head({i:'⚙️',n:'Impostazioni'},0)+`<h2>Codice famiglia</h2><div class="card" style="display:block;text-align:center"><div class="code">${esc(S.code)}</div><p class="sub">Chi lo inserisce entra nella famiglia: condividilo solo con persone fidate.</p></div><h2>Promemoria scadenze</h2><div class="card" style="display:block"><p class="sub">Avvisi a 30, 15, 5 giorni e il giorno della scadenza. ${'Notification'in window?(Notification.permission==='granted'?'✅ Notifiche attive sul dispositivo.':'<button class="btn" data-a="notif">Attiva notifiche</button>'):'Notifiche non supportate qui.'}</p><button class="btn g" data-a="ics">📆 Aggiungi al calendario del telefono (.ics)</button></div><h2>Schede visibili</h2><div class="card" style="display:block;padding:4px 14px">${MODS.map(m=>`<div class="sw"><span>${m.i} ${m.n}</span><input type="checkbox" data-a="vis" data-id="${m.id}" ${S.cfg.hidden.includes(m.id)?'':'checked'}></div>`).join('')}</div><button class="btn g" style="width:100%;margin-top:12px" data-a="leave">Esci dalla famiglia</button><button class="btn g" style="width:100%;margin-top:8px" data-a="out">Disconnetti account</button>`}
function showCode(i){const ov=document.createElement('div');ov.className='ov';ov.dataset.a='close';ov.innerHTML=`${logo(i)}<h1>${esc(i.t)}</h1><p class="sub">${esc(i.who||'')}</p><svg id="bcs"></svg><div style="font:700 26px ui-monospace,monospace;letter-spacing:.12em;margin-top:6px;overflow-wrap:anywhere">${esc(i.code||'')}</div><p class="sub">Tocca per chiudere</p>`;document.body.append(ov);
  try{JsBarcode(ov.querySelector('#bcs'),i.code,{format:i.bt||'CODE128',width:2.6,height:110,displayValue:false,margin:10})}catch(e){try{JsBarcode(ov.querySelector('#bcs'),i.code,{format:'CODE128',width:2.6,height:110,displayValue:false})}catch(_){ov.querySelector('#bcs').remove()}}}
const deadlines=()=>{const r=[];MODS.filter(m=>m.date&&!m.nodue&&m.id!=='agenda'&&!S.cfg.hidden.includes(m.id)).forEach(m=>S.items.filter(i=>i.m===m.id&&!i.done&&i.d).forEach(i=>r.push({id:i.id,t:m.i+' '+(m.id==='doc'?i.k+(i.who?' · '+i.who:''):i.t||i.k||i.who),d:i.d.slice(0,10)})));
  if(!S.cfg.hidden.includes('veic'))S.items.filter(i=>i.m==='vsc'&&i.d).forEach(i=>r.push({id:i.id,t:'🚗 '+vname(i),d:i.d}));return r};
async function checkNotifs(){if(!('Notification'in window)||Notification.permission!=='granted'||!S.code)return;let seen={};try{seen=JSON.parse(localStorage.cn_n||'{}')}catch{}let ch=0;
  for(const x of deadlines()){const n=days(x.d);if(n===null||n>30)continue;const st=n<=0?0:n<=5?5:n<=15?15:30,k=x.id+':'+x.d+':'+st;if(seen[k])continue;seen[k]=1;ch=1;
    const body=n<0?'⚠️ È scaduto!':n===0?'⏰ Scade oggi!':'Scade tra '+n+' giorni ('+fmt(x.d)+')',o={body,icon:'icon-192.png',tag:k};
    const reg=await navigator.serviceWorker?.getRegistration();try{reg?reg.showNotification(x.t,o):new Notification(x.t,o)}catch{}}
  if(ch)try{localStorage.cn_n=JSON.stringify(seen)}catch{}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNotifs()});setInterval(checkNotifs,36e5);
function ics(){const z=n=>String(n).padStart(2,'0'),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Casa Nostra//IT','CALSCALE:GREGORIAN'];
  const al=(t,x)=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+x,'TRIGGER:'+t,'END:VALARM'];
  deadlines().forEach(x=>{const c=x.d.replace(/-/g,''),e=new Date(x.d+'T12:00');e.setDate(e.getDate()+1);const en=e.getFullYear()+z(e.getMonth()+1)+z(e.getDate());
    L.push('BEGIN:VEVENT','UID:'+x.id+'@casanostra','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,''),'DTSTART;VALUE=DATE:'+c,'DTEND;VALUE=DATE:'+en,'SUMMARY:'+x.t.replace(/[,;\n]/g,' ')+' – scadenza',
      ...al('-P29DT15H','Scade tra 30 giorni'),...al('-P14DT15H','Scade tra 15 giorni'),...al('-P4DT15H','Scade tra 5 giorni'),...al('PT9H','Scade oggi'),'END:VEVENT')});
  L.push('END:VCALENDAR');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='casa-nostra-scadenze.ics';a.click()}
const A={
 async notif(){const r=await Notification.requestPermission();if(r==='granted')await checkNotifs();render()},ics(){ics()},
 async login(){try{await signInWithEmailAndPassword(auth,em.value,pw.value)}catch(e){er.textContent='Credenziali non valide.'}},
 async reg(){if(pw.value.length<8)return er.textContent='Password di almeno 8 caratteri.';try{await createUserWithEmailAndPassword(auth,em.value,pw.value)}catch(e){er.textContent='Impossibile creare l\'account ('+e.code+').'}},
 async goog(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){er.textContent='Accesso Google non riuscito.'}},
 async reset(){if(em.value){await sendPasswordResetEmail(auth,em.value).catch(()=>{});er.textContent='Se l\'email esiste, riceverai un link.'}else er.textContent='Inserisci prima l\'email.'},
 out(){signOut(auth)},new(){join(gen(),true)},async join(){try{const c=jc.value.trim().toUpperCase();if(c.length!==8)throw Error('Il codice ha 8 caratteri');await join(c)}catch(e){er.textContent=e.message.includes('permission')?'Codice non valido.':e.message}},
 go(t){S.view=t.dataset.v;S.form=false;render();scrollTo(0,0)},add(){S.form=!S.form;S.logo=null;render()},
 async del(t){const id=t.dataset.id,i=S.items.find(x=>x.id===id);if(!confirm('Eliminare?'))return;if(i.m==='veic')for(const s of S.items.filter(x=>x.veh===id))await deleteDoc(doc(db,fam()+'/items/'+s.id));await deleteDoc(doc(db,fam()+'/items/'+id))},
 tg(t){const i=S.items.find(x=>x.id===t.dataset.id);updateDoc(doc(db,fam()+'/items/'+i.id),{done:!i.done})},

 vd(t){S.veh=t.dataset.id;S.view='veh';S.form=false;render()},lst(t){S.lst=t.dataset.v;render()},tab(t){S.tab=t.dataset.v;render()},cat(t){S.cat=S.cat===t.dataset.v?null:t.dataset.v;render()},

 bud(){setDoc(doc(db,fam()+'/cfg/main'),{...S.cfg,budget:+bud.value||0})},
 vis(t){const h=new Set(S.cfg.hidden);t.checked?h.delete(t.dataset.id):h.add(t.dataset.id);setDoc(doc(db,fam()+'/cfg/main'),{...S.cfg,hidden:[...h]})},
 async leave(){if(confirm('Uscire dalla famiglia?')){const c=S.code;await deleteDoc(doc(db,'families/'+c+'/members/'+S.u.uid));await deleteDoc(doc(db,'users/'+S.u.uid));unsubs.forEach(f=>f());S.code=null;S.items=[];S.view='home';render()}}};

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='FORM'||t.tagName==='OPTION')return;if(t.tagName==='A')e.preventDefault();if(t.type==='checkbox'&&e.type!=='click')return;
  try{await A[t.dataset.a]?.(t)}catch(x){alert('Operazione non riuscita: '+(x.code||x.message))}});
document.addEventListener('change',e=>{if(e.target.id!=='lg'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,160,160);const s=Math.min(160/im.width,160/im.height);x.drawImage(im,(160-im.width*s)/2,(160-im.height*s)/2,im.width*s,im.height*s);S.logo=c.toDataURL('image/webp',.85)};im.src=r.result};r.readAsDataURL(e.target.files[0])});

  const m=mod(S.view),o={m:m.id,at:Date.now(),by:S.u.uid};m.f.forEach(([k])=>{const v=f.elements[k].value.trim();if(v)o[k]=v});if(m.chk)o.done=false;if(m.id==='card'&&S.logo)o.logo=S.logo;if(m.id==='ric'&&!o.k)o.k=S.tab;
