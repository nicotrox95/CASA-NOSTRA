 renew(t){const ov=document.createElement('div');ov.className='ov';ov.style.cssText='background:rgba(0,0,0,.6);color:var(--tx)';ov.innerHTML='<form class="f" style="width:min(92vw,340px)" data-a="rn" data-id="'+t.dataset.id+'"><label>Nuova data di scadenza</label><input name="d" type="date" required><button class="btn">Salva</button><button type="button" class="btn g" data-a="rnx">Annulla</button></form>';document.body.append(ov)},rnx(){document.querySelector('.ov')?.remove()},
 brand(t){const f=document.querySelector('[name=t]');f.value=t.dataset.n;document.querySelector('[name=code]')?.focus()},
 scan(){scan()},
 async notif(){const r=await Notification.requestPermission();if(r==='granted')await checkNotifs();render()},ics(){ics()},
 async login(){try{await signInWithEmailAndPassword(auth,em.value,pw.value)}catch(e){er.textContent='Credenziali non valide.'}},
 async reg(){if(pw.value.length<8)return er.textContent='Password di almeno 8 caratteri.';try{await createUserWithEmailAndPassword(auth,em.value,pw.value)}catch(e){er.textContent='Impossibile creare l\'account ('+e.code+').'}},
 async goog(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){er.textContent='Accesso Google non riuscito.'}},
 async reset(){if(em.value){await sendPasswordResetEmail(auth,em.value).catch(()=>{});er.textContent='Se l\'email esiste, riceverai un link.'}else er.textContent='Inserisci prima l\'email.'},
 out(){try{localStorage.removeItem('cn_fam')}catch{}signOut(auth)},new(){join(gen(),true)},async join(){try{const c=jc.value.trim().toUpperCase();if(c.length!==8)throw Error('Il codice ha 8 caratteri');await join(c)}catch(e){er.textContent=e.message.includes('permission')?'Codice non valido.':e.message}},
 go(t){S.view=t.dataset.v;S.form=false;S.edit=null;S.rv=null;render();scrollTo(0,0)},add(){S.form=!S.form;S.logo=null;S.vph=null;S.rph=null;S.edit=null;render()},
 edit(t){S.edit=t.dataset.id;S.form=true;S.logo=null;S.vph=null;S.rph=null;S.rv=null;render();scrollTo(0,0)},
 async del(t){const id=t.dataset.id,i=S.items.find(x=>x.id===id);if(!confirm('Eliminare?'))return;if(i.m==='gar'||i.m==='veic')getDocs(query(collection(db,fam()+'/receipts'),where('gid','==',id))).then(q=>q.docs.forEach(d=>deleteDoc(d.ref))).catch(()=>{});if(i.m==='veic')for(const s of S.items.filter(x=>x.veh===id))deleteDoc(doc(db,fam()+'/items/'+s.id));await deleteDoc(doc(db,fam()+'/items/'+id))},
 tg(t){const i=S.items.find(x=>x.id===t.dataset.id);updateDoc(doc(db,fam()+'/items/'+i.id),{done:!i.done})},
 bc(t){showCode(S.items.find(x=>x.id===t.dataset.id))},close(t){t.remove()},
 vd(t){S.veh=t.dataset.id;S.view='veh';S.vt='d';S.form=false;render()},
 vt(t){S.vt=t.dataset.v;S.form=false;render()},lst(t){S.lst=t.dataset.v;render()},tab(t){S.tab=t.dataset.v;render()},cat(t){S.cat=S.cat===t.dataset.v?null:t.dataset.v;render()},
 nl(){const n=prompt('Nome della nuova lista (es. Farmacia)');if(n){S.lst=n.trim().slice(0,30);render()}},
 async ncat(){const n=(prompt('Nome della nuova categoria (puoi iniziare con un’emoji, es. 🐶 Animali)')||'').trim().slice(0,30);if(!n)return;if(!ALLC().includes(n))setDoc(doc(db,fam()+'/cfg/main'),{...S.cfg,cats:[...(S.cfg.cats||[]),n]});if(document.querySelector('.ov')&&S.pend)await A.pc({dataset:{v:n}})},
 async dcat(){if(!confirm('Eliminare la categoria “'+S.cat+'”? I prodotti passeranno in Altro.'))return;await setDoc(doc(db,fam()+'/cfg/main'),{...S.cfg,cats:(S.cfg.cats||[]).filter(c=>c!==S.cat)});S.cat=null;render()},
 qp(t){addQ(t.dataset.v,S.cat)},async pc(t){const c=t.dataset.v,q=S.pend,id=S.pendId;document.querySelector('.ov')?.remove();S.pendId=null;if(id){updateDoc(doc(db,fam()+'/items/'+id),{cat:c});saveProd(q,c)}else addQ(q,c)},rc(t){const i=S.items.find(x=>x.id===t.dataset.id);askCat(i.t,i.id)},async clr(){for(const i of S.items.filter(x=>x.m==='list'&&x.done&&(x.grp||'Spesa')===S.lst))deleteDoc(doc(db,fam()+'/items/'+i.id))},
 bud(){setDoc(doc(db,fam()+'/cfg/main'),{...S.cfg,budget:+bud.value||0})},
 vis(t){const h=new Set(S.cfg.hidden);t.checked?h.delete(t.dataset.id):h.add(t.dataset.id);setDoc(doc(db,fam()+'/cfg/main'),{...S.cfg,hidden:[...h]})},
 async leave(){if(confirm('Uscire dalla famiglia?')){const c=S.code;await deleteDoc(doc(db,'families/'+c+'/members/'+S.u.uid));await deleteDoc(doc(db,'users/'+S.u.uid));unsubs.forEach(f=>f());try{localStorage.removeItem('cn_fam')}catch{}S.code=null;S.items=[];S.view='home';render()}}};
const addQ=async(q,cat)=>{q=q.trim().slice(0,80);if(!q)return;const c=cat||catOf(q);if(!c)return askCat(q);setDoc(doc(db,fam()+'/items/'+nid()),{m:'list',t:q,cat:c,grp:S.lst,done:false,at:Date.now(),by:S.u.uid});if(!catExact(q))saveProd(q,c)};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='FORM'||t.tagName==='OPTION')return;if(t.tagName==='A')e.preventDefault();if(t.type==='checkbox'&&e.type!=='click')return;
  try{await A[t.dataset.a]?.(t)}catch(x){alert('Operazione non riuscita: '+(x.code||x.message))}});
document.addEventListener('input',e=>{if(e.target.id==='rs'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.rcard').forEach(b=>b.style.display=b.dataset.s.includes(q)?'':'none');return}if(e.target.id==='fs'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.fr').forEach(b=>b.style.display=b.dataset.s.includes(q)?'':'none');const a=document.getElementById('farc');if(a)a.style.display=(q||S.farch)?'block':'none';return}if(e.target.id==='ags'){const q=e.target.value.toLowerCase();document.querySelectorAll('.ar').forEach(b=>b.style.display=b.dataset.s.includes(q)?'':'none');return}if(e.target.id==='gs'){S.q=e.target.value;gsearch(S.q);return}if(e.target.id!=='brs')return;const q=e.target.value.toLowerCase();document.querySelectorAll('.bb').forEach(b=>b.style.display=b.dataset.n.toLowerCase().includes(q)?'':'none')});
document.addEventListener('change',async e=>{if(e.target.id==='rph'&&e.target.files[0]){S.rph=await shrink(e.target.files[0],480,.65);return}if(e.target.id==='vph'&&e.target.files[0]){S.vph=await shrink(e.target.files[0],360,.7);return}if(e.target.id==='imf'&&e.target.files.length){const m=document.getElementById('imst');try{m.textContent='Preparo la lettura…';fillRic(parseRecipe(await ocr([...e.target.files])))}catch(x){if(m)m.textContent='⚠️ Lettura non riuscita (serve internet). '+(x.message||'')}return}if(e.target.id!=='rcf'||!e.target.files[0])return;const ov=document.querySelector('.ov[data-rc]'),gid=ov.dataset.rc;let o=await shrink(e.target.files[0],1280,.7);if(o.length>850000)o=await shrink(e.target.files[0],900,.5);
  const id='r'+nid(),d={gid,img:o,at:Date.now(),by:S.u.uid};S.rc.push({id,...d});drawRc(ov);setDoc(doc(db,fam()+'/receipts/'+id),d);updateDoc(doc(db,fam()+'/items/'+gid),{rc:increment(1)});const g=S.items.find(i=>i.id===gid);if(g&&g.m==='veic'&&!g.img)shrink(e.target.files[0],360,.7).then(th=>updateDoc(doc(db,fam()+'/items/'+gid),{img:th}))});
document.addEventListener('change',e=>{if(e.target.id!=='lg'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,160,160);const s=Math.min(160/im.width,160/im.height);x.drawImage(im,(160-im.width*s)/2,(160-im.height*s)/2,im.width*s,im.height*s);S.logo=c.toDataURL('image/webp',.85)};im.src=r.result};r.readAsDataURL(e.target.files[0])});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,a=f.dataset.a;
  try{if(a==='rn'){updateDoc(doc(db,fam()+'/items/'+f.dataset.id),{d:f.d.value});document.querySelector('.ov')?.remove();return}
  if(a==='qa'){addQ(f.q.value);f.q.value='';return}
  if(a==='va'){const q=f.q.value.trim();if(q)setDoc(doc(db,fam()+'/items/'+nid()),{m:'val',t:q.slice(0,80),grp:S.trip,done:false,at:Date.now(),by:S.u.uid});f.q.value='';return}
  if(a==='vd'){const p={};VD.forEach(([k])=>p[k]=f.elements[k].value.trim());S.form=false;render();await updateDoc(doc(db,fam()+'/items/'+S.veh),p);return}
  if(a==='vman'){const o={m:'vman',veh:S.veh,at:Date.now(),by:S.u.uid};['k','d','km','cost','t'].forEach(k=>{const v=f.elements[k].value.trim();if(v)o[k]=v});S.form=false;render();await setDoc(doc(db,fam()+'/items/'+nid()),o);return}
  if(a==='dsave'){const k=f.k.value.trim(),d=f.d.value;if(S.edit){const id=S.edit;S.edit=null;S.form=false;render();await updateDoc(doc(db,fam()+'/items/'+id),{k,d});return}S.form=false;render();await setDoc(doc(db,fam()+'/items/'+nid()),{m:'doc',who:S.dp,k,d,at:Date.now(),by:S.u.uid});return}
  if(a==='savesc'){setDoc(doc(db,fam()+'/items/'+nid()),{m:'vsc',veh:S.veh,k:f.k.value,d:f.d.value,at:Date.now(),by:S.u.uid});S.form=false;return render()}
  const m=mod(S.view),o={m:m.id,at:Date.now(),by:S.u.uid};m.f.forEach(([k])=>{const v=f.elements[k].value.trim();if(v)o[k]=v});if(m.chk)o.done=false;if(m.id==='card'&&S.logo)o.logo=S.logo;if(m.id==='veic'&&S.vph)o.img=S.vph;if(m.id==='ric'&&S.rph)o.img=S.rph;if(m.id==='ric'&&!o.k)o.k=S.tab;if(m.id==='ric'){if(o.ing)o.ing=bl(o.ing);if(o.st)o.st=bl(o.st)}
  if(S.edit){const p={};m.f.forEach(([k])=>p[k]=f.elements[k].value.trim());if(m.id==='ric'){p.ing=bl(p.ing);p.st=bl(p.st)}if(m.id==='card'&&S.logo)p.logo=S.logo;if(m.id==='veic'&&S.vph)p.img=S.vph;if(m.id==='ric'&&S.rph)p.img=S.rph;const id=S.edit;S.edit=null;S.form=false;render();await updateDoc(doc(db,fam()+'/items/'+id),p);return}
  S.form=false;render();await setDoc(doc(db,fam()+'/items/'+nid()),o)}catch(x){alert('Salvataggio non riuscito: '+(x.code||x.message))}});
</script></body></html>
